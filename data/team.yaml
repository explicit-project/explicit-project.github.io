# -----------------------------------------------------------------------------
# Team data file for the project
#
# Structure:
#   - Each top-level entry defines a "role" or group within the project team.
#   - Under each role, the "members" key lists one or more team members.
#
# Fields:
#   role:           Name of the group or role.
#                   Accepted values: "pi" (principal investigator) or
#                                     "researcher"
#   members:        List of member entries for that role
#
# Each member entry supports the following fields:
#   name:           Full name of the member (required)
#   affiliation:    Institutional or research group affiliation (optional)
#   image:          Path to the member’s photo (optional, relative to or /assets)
#   links:          List of key-value pairs for external links (optional)
#                   Common keys: email, orcid, gscholar
#
# Example:
# - role: "researcher"
#   members:
#     - name: "John Doe"
#       affiliation: "University XXX"
#       image: "img/team/john.webp"
#       links:
#         - email: "john.doe@university.edu"
#         - link: "https://www.example.com"
#         - orcid: "0000-0000-0000-0000"
#         - google-scholar: "XXXXXXXXXXXX"
#
# -----------------------------------------------------------------------------

